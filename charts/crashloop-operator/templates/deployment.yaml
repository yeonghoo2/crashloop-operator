apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crashloop-operator.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "crashloop-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "crashloop-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "crashloop-operator.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "crashloop-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: manager
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        command:
        - /manager
        args:
        - --v={{ .Values.operator.logLevel }}
        {{- if .Values.operator.watchNamespace }}
        - --namespace={{ .Values.operator.watchNamespace }}
        {{- end }}
        - --health-probe-bind-address=0.0.0.0:{{ .Values.operator.healthPort }}
        - --recheck-interval={{ .Values.operator.recheckInterval }}s
        - --min-restart-count={{ .Values.operator.minRestartCount }}
        ports:
        - containerPort: {{ .Values.operator.healthPort }}
          name: health
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: health
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readyz
            port: health
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 1
          failureThreshold: 3
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        env:
        - name: KUBERNETES_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: TARGET_LABELS
          value: {{ toJson .Values.operator.targetLabels | quote }}
        - name: LOG_LEVEL
          value: {{ .Values.operator.logLevel | quote }}
        - name: RECHECK_INTERVAL
          value: {{ .Values.operator.recheckInterval | quote }}
        - name: MIN_RESTART_COUNT
          value: {{ .Values.operator.minRestartCount | quote }}
        - name: PROGRESS_DEADLINE_SECONDS
          value: {{ .Values.operator.progressDeadlineSeconds | quote }}
        {{- if .Values.operator.watchNamespace }}
        - name: WATCH_NAMESPACE
          value: {{ .Values.operator.watchNamespace | quote }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 10